version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: officia
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # Superuser owns the instance. Apply src/lib/db/roles.sql after first boot
    # so DATABASE_URL can use officia_app (NOBYPASSRLS, not table owner) and
    # DATABASE_MIGRATE_URL can use officia_migrate. Do not enable FORCE RLS.

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
